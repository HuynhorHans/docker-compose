version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql_server_container
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Password123

  redis:
    image: redis:latest
    container_name: redis_container
    ports:
      - "6379:6379" # Đổi từ 8080 thành 6379 để nhường cổng 8080 cho Spring Boot nha cậu!